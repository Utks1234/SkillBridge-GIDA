<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="36" fill="#0b132b"/>
  <!-- Sun/Moon Glow -->
  <circle cx="150" cy="55" r="42" fill="#10b981" fill-opacity="0.12"/>
  <circle cx="150" cy="55" r="30" fill="#10b981" fill-opacity="0.25"/>
  <circle cx="150" cy="55" r="18" fill="#10b981" fill-opacity="0.4"/>
  <!-- Factory on Left -->
  <path d="M 25 150 L 25 110 L 40 125 L 40 100 L 55 115 L 55 85 L 70 85 L 70 150 Z" fill="#3a506b"/>
  <rect x="32" y="125" width="8" height="8" rx="1" fill="#10b981"/>
  <rect x="46" y="125" width="8" height="8" rx="1" fill="#10b981"/>
  <!-- Smoke plume -->
  <circle cx="62" cy="72" r="4" fill="#64748b"/>
  <circle cx="66" cy="62" r="5" fill="#475569"/>
  <!-- House / Facility on Right -->
  <polygon points="135,105 160,85 185,105" fill="#475569"/>
  <rect x="140" y="105" width="40" height="45" fill="#3a506b"/>
  <rect x="145" y="115" width="8" height="8" rx="1" fill="#10b981"/>
  <rect x="167" y="115" width="8" height="8" rx="1" fill="#10b981"/>
  <rect x="156" y="127" width="8" height="23" fill="#1e293b"/>
  <!-- Central Arched Bridge (The Bridge Connecting Youth & Factory) -->
  <path d="M 65 145 C 65 95, 135 95, 135 145" stroke="#10b981" stroke-width="5" fill="none"/>
  <line x1="82" y1="110" x2="82" y2="145" stroke="#10b981" stroke-width="2.5"/>
  <line x1="100" y1="98" x2="100" y2="145" stroke="#10b981" stroke-width="2.5"/>
  <line x1="118" y1="110" x2="118" y2="145" stroke="#10b981" stroke-width="2.5"/>
  <!-- Bridge Deck -->
  <line x1="15" y1="145" x2="185" y2="145" stroke="#34d399" stroke-width="4"/>
  <!-- River Water Waves -->
  <path d="M 15 170 Q 55 160, 95 170 T 175 170" stroke="#1e293b" stroke-width="4" fill="none"/>
  <path d="M 25 182 Q 65 172, 105 182 T 185 182" stroke="#1e293b" stroke-width="4" fill="none"/>
</svg>
